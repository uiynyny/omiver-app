# Shared security headers.
#
# IMPORTANT nginx gotcha: `add_header` directives are inherited from the
# enclosing block ONLY when the current block declares none of its own.
# Any `location` that adds a header of its own must therefore `include`
# this file too, or it silently loses every header below.
#
# Content-Security-Policy allow-list rationale:
#   script-src   'self' + Stripe.js (required by @stripe/stripe-js).
#                'unsafe-inline' is deliberately NOT granted.
#   style-src    'unsafe-inline' is required because React inline styles and
#                Stripe Elements inject styles at runtime.
#   connect-src  'self' covers the same-origin /api proxy; Stripe.js talks to
#                api.stripe.com directly.
#   frame-src    Stripe mounts its card fields in cross-origin iframes.
#   frame-ancestors 'none' blocks clickjacking (the modern X-Frame-Options).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(self)" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
