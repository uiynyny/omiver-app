server {
    listen 3000;
    server_tokens off;

    root /usr/share/nginx/html;

    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = / {
        return 301 /app/;
    }

    # The app shell must never be cached, or clients pin an old build.
    location = /app/index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Vite emits content-hashed filenames, so these are safe to pin forever.
    location ~* ^/app/assets/.*\.(js|css|woff2?|png|jpe?g|svg|webp)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA fallback: unknown paths resolve to the app shell.
    location / {
        try_files $uri $uri/ /app/index.html;
    }
}
